name: AI Daily Report

on:
  schedule:
    # 每天北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: '清空今日状态强制重推 (yes/no)'
        required: false
        default: 'no'

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset state
        if: github.event.inputs.reset == 'yes'
        run: python3 scripts/run.py --reset

      - name: Check push state
        run: python3 scripts/run.py --check

      - name: Run daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/run.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update daily report state $(date +%Y-%m-%d)"
          git push
